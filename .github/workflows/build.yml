name: Build ControlQPC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ios-simulator:
    name: Build iOS simulator app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator app
        run: |
          xcodebuild \
            -project ControlQPC.xcodeproj \
            -scheme ControlQPC \
            -sdk iphonesimulator \
            -configuration Debug \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData \
            build

      - name: Package simulator app
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          /usr/bin/zip -r "$GITHUB_WORKSPACE/ControlQPC-simulator-app.zip" ControlQPC.app

      - name: Package source code
        run: |
          git archive --format=zip --prefix=ControlQPC-source/ HEAD -o ControlQPC-source.zip

      - name: Upload build and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ControlQPC-build-and-source
          path: |
            ControlQPC-simulator-app.zip
            ControlQPC-source.zip
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ControlQPC-simulator-app.zip
            ControlQPC-source.zip
