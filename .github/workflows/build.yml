name: Build ControlQPC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ios-build:
    name: Build iOS app and source packages
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ControlQPC.xcodeproj \
            -scheme ControlQPC \
            -sdk iphonesimulator \
            -configuration Debug \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData \
            build

      - name: Package simulator app
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          /usr/bin/zip -r "$GITHUB_WORKSPACE/ControlQPC-simulator-app.zip" ControlQPC.app

      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project ControlQPC.xcodeproj \
            -scheme ControlQPC \
            -sdk iphoneos \
            -configuration Release \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DeviceDerivedData \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DeviceDerivedData/Build/Products/Release-iphoneos/ControlQPC.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/ControlQPC.app
          cd build/ipa
          /usr/bin/zip -r "$GITHUB_WORKSPACE/ControlQPC-unsigned.ipa" Payload

      - name: Package source code
        run: git archive --format=zip --prefix=ControlQPC-source/ HEAD -o ControlQPC-source.zip

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ControlQPC-release-files
          path: |
            ControlQPC-unsigned.ipa
            ControlQPC-simulator-app.zip
            ControlQPC-source.zip
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ControlQPC-unsigned.ipa
            ControlQPC-simulator-app.zip
            ControlQPC-source.zip
